<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Seguimiento de tu pedido — TortiRappi</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #f5f4f0; }
    .tracking-wrap { max-width: 440px; margin: 0 auto; padding: 16px; }
    .brand-header { text-align: center; padding: 24px 16px 8px; }
    .brand-name { font-size: 22px; font-weight: 800; color: var(--primary-dark); letter-spacing: -0.4px; }
    .brand-name span { color: var(--accent); }
    .brand-sub { font-size: 13px; color: var(--gray); }
    .order-hero { text-align: center; padding: 10px 0 4px; }
    .order-num { font-size: 36px; font-weight: 800; color: var(--primary-dark); }
    .order-for { font-size: 14px; color: var(--gray); }
    .eta-pill { display: inline-block; background: var(--amber-light); color: var(--amber-dark); font-weight: 800; font-size: 14px; padding: 6px 16px; border-radius: 20px; margin-top: 8px; }
    .footer-wa { position: sticky; bottom: 0; background: #fff; border-top: 1px solid #e4e2dc; padding: 12px 16px; }
    .big-badge { font-size: 14px; padding: 6px 14px; }
  </style>
</head>
<body>

<div class="brand-header">
  <div class="brand-name">Torti<span>Rappi</span></div>
  <div class="brand-sub">Seguimiento de tu pedido en tiempo real</div>
</div>

<div class="tracking-wrap">

  <div class="card" id="not-found" style="display:none;text-align:center;padding:30px;">
    <div style="font-size:40px;margin-bottom:12px;">🔍</div>
    <div style="font-weight:700;font-size:16px;margin-bottom:6px;">Pedido no encontrado</div>
    <div style="font-size:13px;color:var(--gray);">El link puede haber expirado o ser incorrecto. Contáctanos por WhatsApp.</div>
    <a id="wa-negocio" href="#" target="_blank" style="text-decoration:none;">
      <button class="btn btn-wa btn-full" style="margin-top:16px;">💬 Escribir al negocio</button>
    </a>
  </div>

  <div class="card" id="loading" style="text-align:center;padding:30px;">
    <div style="font-size:32px;animation:pulse 1.5s infinite;display:inline-block;">🫓</div>
    <div style="font-size:14px;color:var(--gray);margin-top:8px;">Buscando tu pedido...</div>
  </div>

  <div id="main-content" style="display:none;">

    <div class="card order-hero">
      <div style="font-size:12px;color:var(--gray);font-weight:700;text-transform:uppercase;letter-spacing:.5px;">Tu pedido</div>
      <div class="order-num" id="t-num"></div>
      <div class="order-for" id="t-cliente"></div>
      <div style="margin-top:8px;" id="t-estado-badge"></div>
      <div class="eta-pill" id="t-eta" style="display:none;"></div>
    </div>

    <div class="card" id="mapa-card" style="display:none;">
      <div id="gmap-tracking"></div>
    </div>

    <div class="card">
      <div class="card-title">Estado del pedido</div>
      <div class="tracking-steps" id="t-pasos"></div>
    </div>

    <div class="card">
      <div class="card-title">🛒 Contenido de tu pedido</div>
      <div id="t-detalle"></div>
    </div>

    <div class="card" style="text-align:center;margin-bottom:80px;">
      <div id="t-negocio-nombre" style="font-weight:800;font-size:15px;color:var(--primary-dark);"></div>
      <div id="t-negocio-dir"    style="font-size:12px;color:var(--gray);margin-top:4px;"></div>
      <div style="font-size:12px;color:var(--gray);margin-top:6px;">Actualizado hace <span id="t-updated">—</span></div>
    </div>

  </div>
</div>

<div class="footer-wa" id="footer-wa" style="display:none;">
  <a id="wa-link" href="#" target="_blank" style="text-decoration:none;">
    <button class="btn btn-wa btn-full">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff" style="flex-shrink:0"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
      Hablar con nosotros
    </button>
  </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/maps-loader.js"></script>
<script src="js/tracking.js"></script>
</body>
</html>
